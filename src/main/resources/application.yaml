server:
  port: 24110
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/distcomp
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog.xml
logging:
  level:
    org.springframework.jdbc: TRACE
    liquibase: INFO
